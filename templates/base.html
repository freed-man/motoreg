{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}?v=2">
    <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}
    {% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">{{ SITE_NAME }}</a>
            <a class="nav-link text-white" href="{% url 'insurance_page' %}">
                <i class="fas fa-shield-alt"></i> Insurance
            </a>
        </div>
    </nav>

    <main class="container mt-4 mb-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}
    {% endblock %}

    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" id="backToTop"
        class="btn btn-dark rounded-circle position-fixed" aria-label="Back to top"
        style="bottom: 30px; right: 30px; display: none; width: 45px; height: 45px; z-index: 999;">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script>
        var backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', function () {
            backToTop.style.display = window.scrollY > 300 ? 'block' : 'none';
        });
    </script>

</body>

</html>
